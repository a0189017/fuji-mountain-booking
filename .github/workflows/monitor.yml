name: Fuji Mountain Monitor

on:
  repository_dispatch:
    types: [check-availability]   # triggered by cron-job.org every minute
  workflow_dispatch:              # allow manual trigger from GitHub UI
  schedule:
    - cron: '*/5 * * * *'        # fallback: GitHub's own scheduler (unreliable, kept as backup)

concurrency:
  group: monitor
  cancel-in-progress: false   # queue runs rather than cancel them

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit state.json back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (browser already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run availability check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TARGET_DATE: '31'
          TARGET_PEOPLE: '2'
        run: python main.py --once

      - name: Save notification state
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update notification state [skip ci]"
          git push
